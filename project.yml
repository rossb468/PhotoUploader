name: PhotoUploader
options:
  bundleIdPrefix: com.rossbower
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  PhotoUploader:
    type: application
    platform: macOS
    sources:
      - path: Sources/PhotoUploader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rossbower.photouploader
        PRODUCT_NAME: PhotoUploader
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Photo Uploader"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.photography"
    info:
      path: Generated/Info.plist
      properties:
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
              - public.heic
schemes:
  PhotoUploader:
    build:
      targets:
        PhotoUploader: all
    run:
      config: Debug
    archive:
      config: Release
